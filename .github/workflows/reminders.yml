name: Shift reminders

# Free scheduler for Tudo's shift reminders (30-min-before sign-in nudge +
# checkout buzzer). Pings the app's reminder endpoint, which decides who is due.
# GitHub's cron can drift a few minutes under load — fine for reminders.
#
# Setup (one time):
#   1. Add a repo secret CRON_SECRET (Settings → Secrets → Actions).
#   2. Add the SAME value as env var CRON_SECRET in Vercel (so the endpoint
#      accepts the call).

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch: {}      # lets you run it on demand from the Actions tab

concurrency:
  group: tudo-reminders
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping reminder endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret is not set — skipping."
            exit 0
          fi
          curl -fsS --max-time 60 -X GET \
            "https://hi-tudo.vercel.app/api/cron/reminders" \
            -H "Authorization: Bearer $CRON_SECRET"
